<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AppDock — 应用构建与分发中心</title>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <style>
    :root {
      --bg: oklch(15% 0.012 250);
      --surface: oklch(19% 0.014 250);
      --surface-2: oklch(23% 0.014 250);
      --fg: oklch(94% 0.01 250);
      --muted: oklch(62% 0.02 250);
      --border: oklch(30% 0.016 250);
      --accent: oklch(72% 0.13 195);
      --accent-dim: oklch(72% 0.13 195 / 0.15);
      --success: oklch(70% 0.14 145);
      --success-dim: oklch(70% 0.14 145 / 0.15);
      --warn: oklch(78% 0.12 85);
      --warn-dim: oklch(78% 0.12 85 / 0.15);
      --danger: oklch(65% 0.18 25);
      --danger-dim: oklch(65% 0.18 25 / 0.15);
      --info: oklch(68% 0.12 250);
      --info-dim: oklch(68% 0.12 250 / 0.15);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      --radius: 6px;
      --radius-lg: 10px;
      --sidebar: 240px;
      --topbar: 56px;
      --shadow-glow: 0 0 0 1px oklch(72% 0.13 195 / 0.25), 0 0 24px oklch(72% 0.13 195 / 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--fg); cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s, box-shadow .15s; white-space: nowrap; }
    .btn:hover { background: oklch(27% 0.014 250); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: oklch(18% 0.02 195); border-color: transparent; font-weight: 600; }
    .btn-primary:hover { background: oklch(78% 0.13 195); color: oklch(18% 0.02 195); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--fg); }
    .btn-danger { background: var(--danger-dim); color: var(--danger); border-color: oklch(65% 0.18 25 / 0.35); }
    .btn-danger:hover { background: oklch(65% 0.18 25 / 0.28); color: var(--danger); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
    .btn-lg { height: 44px; padding: 0 20px; font-size: 15px; }
    .btn-block { width: 100%; }

    /* Form */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); font-weight: 500; }
    .field .hint { font-size: 12px; color: var(--muted); }
    .input, .select, .textarea { width: 100%; height: 36px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--fg); transition: border-color .15s, box-shadow .15s; }
    .textarea { height: auto; min-height: 88px; padding: 10px 12px; resize: vertical; }
    .input:hover, .select:hover, .textarea:hover { border-color: oklch(38% 0.016 250); }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); outline: none; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .span-2 { grid-column: span 2; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: .15s; }
    .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: var(--muted); border-radius: 50%; transition: .15s; }
    .switch input:checked + span { background: var(--accent-dim); border-color: var(--accent); }
    .switch input:checked + span::after { transform: translateX(18px); background: var(--accent); }

    /* Pills */
    .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1; }
    .pill-success { background: var(--success-dim); color: var(--success); }
    .pill-warn { background: var(--warn-dim); color: var(--warn); }
    .pill-danger { background: var(--danger-dim); color: var(--danger); }
    .pill-muted { background: oklch(30% 0.01 250 / 0.5); color: var(--muted); }
    .pill-info { background: var(--info-dim); color: var(--info); }
    .pill-accent { background: var(--accent-dim); color: var(--accent); }

    /* Cards / panels */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .card-pad { padding: 20px; }
    .panel-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }

    /* Table */
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data th { text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
    table.data td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.data tr:last-child td { border-bottom: none; }
    table.data tbody tr { transition: background .12s; }
    table.data tbody tr:hover { background: oklch(22% 0.014 250); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: oklch(8% 0.01 250 / 0.72); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; backdrop-filter: blur(4px); }
    .modal { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 24px 64px oklch(0% 0 0 / 0.45); }
    .modal-hd { padding: 18px 20px 0; font-size: 16px; font-weight: 600; }
    .modal-bd { padding: 12px 20px 18px; color: var(--muted); font-size: 14px; }
    .modal-ft { padding: 0 20px 20px; display: flex; justify-content: flex-end; gap: 8px; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab { height: 40px; padding: 0 14px; background: transparent; border: none; color: var(--muted); cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab:hover { color: var(--fg); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Logo */
    .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 650; letter-spacing: -.02em; }
    .logo:hover { text-decoration: none; color: var(--fg); }
    .logo svg { flex-shrink: 0; }
    .logo .mark { color: var(--accent); }

    /* Public layout */
    .pub-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .pub-top { height: var(--topbar); border-bottom: 1px solid var(--border); background: oklch(15% 0.012 250 / 0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; }
    .pub-top-inner { max-width: 1120px; margin: 0 auto; height: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .pub-nav { display: flex; align-items: center; gap: 8px; }
    .pub-main { flex: 1; max-width: 1120px; width: 100%; margin: 0 auto; padding: 32px 24px 64px; }
    .pub-footer { border-top: 1px solid var(--border); padding: 20px 24px; text-align: center; color: var(--muted); font-size: 12px; }

    /* Admin layout */
    .admin-shell { display: flex; min-height: 100vh; }
    .admin-side { width: var(--sidebar); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .admin-side-hd { height: var(--topbar); padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
    .admin-nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; }
    .nav-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: var(--radius); color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: background .12s, color .12s; }
    .nav-item:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); box-shadow: inset 0 0 0 1px oklch(72% 0.13 195 / 0.25); }
    .nav-item svg { opacity: .85; }
    .nav-sec { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 14px 12px 6px; }
    .admin-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .admin-top { height: var(--topbar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg); }
    .admin-content { padding: 24px 28px 48px; flex: 1; }
    .page-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .page-hd h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    .page-hd .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .breadcrumb a { color: var(--muted); }
    .breadcrumb a:hover { color: var(--accent); }

    /* App cards public */
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .app-card { display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); transition: border-color .15s, box-shadow .15s, transform .15s; cursor: pointer; text-decoration: none; color: inherit; }
    .app-card:hover { border-color: oklch(40% 0.02 195); box-shadow: var(--shadow-glow); text-decoration: none; transform: translateY(-1px); }
    .app-icon { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: oklch(18% 0.02 195); }
    .platform-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .plat { height: 22px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; font-family: var(--mono); }

    /* Download groups */
    .dl-groups { display: grid; gap: 12px; }
    .dl-group { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
    .dl-group-hd { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: oklch(17% 0.014 250); }
    .dl-asset { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .dl-asset:last-child { border-bottom: none; }
    .dl-asset:hover { background: oklch(21% 0.014 250); }
    .dl-meta { flex: 1; min-width: 0; }
    .dl-name { font-family: var(--mono); font-size: 13px; word-break: break-all; }
    .dl-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

    /* Dropzone */
    .dropzone { border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: 36px 24px; text-align: center; background: oklch(17% 0.012 250); transition: border-color .15s, background .15s, box-shadow .15s; cursor: pointer; }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-dim); box-shadow: var(--shadow-glow); }
    .dropzone .dz-title { font-weight: 600; margin-bottom: 4px; }
    .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .file-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .file-row .name { flex: 1; font-family: var(--mono); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Stats */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card { padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
    .stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 650; letter-spacing: -.03em; font-family: var(--mono); }
    .stat-card .delta { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Auth pages */
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse 80% 50% at 50% -20%, oklch(72% 0.13 195 / 0.12), transparent); }
    .auth-card { width: min(400px, 100%); padding: 28px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 20px 60px oklch(0% 0 0 / 0.35); }
    .auth-card h1 { font-size: 20px; font-weight: 650; margin: 16px 0 6px; }
    .auth-card .lead { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .auth-stack { display: flex; flex-direction: column; gap: 14px; }

    /* Empty */
    .empty { text-align: center; padding: 64px 24px; border: 1px dashed var(--border); border-radius: var(--radius-lg); background: var(--surface); }
    .empty h2 { font-size: 18px; margin: 12px 0 6px; }
    .empty p { color: var(--muted); margin-bottom: 18px; max-width: 360px; margin-inline: auto; }

    /* Hero public */
    .hero { margin-bottom: 28px; }
    .hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -.03em; margin-bottom: 8px; }
    .hero p { color: var(--muted); max-width: 560px; font-size: 15px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 24px; align-items: center; }
    .search { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search input { padding-left: 36px; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
    .chip:hover { color: var(--fg); background: var(--surface-2); }
    .chip.active { background: var(--accent-dim); color: var(--accent); border-color: oklch(72% 0.13 195 / 0.4); }

    .changelog { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); padding: 16px 18px; }
    .changelog pre { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; color: var(--fg); line-height: 1.6; }
    .collapse-hd { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; color: var(--fg); cursor: pointer; padding: 12px 0; font-weight: 600; }
    .ver-list { border-top: 1px solid var(--border); }
    .ver-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .ver-row:last-child { border-bottom: none; }

    .user-menu { position: relative; }
    .user-btn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
    .user-btn:hover { background: var(--surface-2); }
    .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .dropdown { position: absolute; right: 0; top: calc(100% + 6px); min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 6px; box-shadow: 0 12px 40px oklch(0% 0 0 / 0.4); z-index: 80; }
    .dropdown a, .dropdown button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; border: none; background: none; color: var(--fg); text-decoration: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; text-align: left; }
    .dropdown a:hover, .dropdown button:hover { background: var(--surface-2); text-decoration: none; }

    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 1100; padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 32px oklch(0% 0 0 / 0.4); font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .toast.ok { border-color: oklch(70% 0.14 145 / 0.4); }

    .member-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); margin-bottom: 8px; }
    .webhook-box { font-family: var(--mono); font-size: 12px; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); word-break: break-all; color: var(--accent); }

    @media (max-width: 1100px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span-2 { grid-column: span 1; }
    }
    @media (max-width: 800px) {
      .admin-shell { flex-direction: column; }
      .admin-side { width: 100%; height: auto; position: static; }
      .admin-nav { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>

function Logo({ size = 28, word = true }) {

function genAccessCode() {
  const hex = Math.random().toString(16).slice(2, 10);
  return { plain: `dock_${hex}_${Date.now().toString(36).slice(-4)}`, prefix: `dock_${hex.slice(0, 4)}` };
}

function maskCodePrefix(prefix) {
  return `${prefix}••••`;
}

function isCodeExpired(c) {
  if (!c.expiresAt) return false;
  return new Date(c.expiresAt.replace(/-/g, "/")) < new Date();
}

function isCodeUsable(c, appId) {
  if (!c || c.status !== "active") return false;
  if (isCodeExpired(c)) return false;
  if (c.maxUses != null && c.usedCount >= c.maxUses) return false;
  if (appId && !(c.appIds || []).includes(appId)) return false;
  return true;
}

/* ========== Router ========== */
function parseHash() {
  const raw = (location.hash || "#/").replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const query = Object.fromEntries(new URLSearchParams(qs || ""));
  return { path: "/" + parts.join("/"), parts, query };
}

function navigate(to) {
  if (!to.startsWith("#")) to = "#" + (to.startsWith("/") ? to : "/" + to);
  location.hash = to.slice(1);
}

function Link({ to, className, children, ...rest }) {
  const href = to.startsWith("#") ? to : "#" + (to.startsWith("/") ? to : "/" + to);
  return <a href={href} className={className} {...rest}>{children}</a>;
}

/* ========== Atoms ========== */
function Pill({ tone = "muted", children }) {
  return <span className={`pill pill-${tone}`}>{children}</span>;
}

function VisBadge({ v }) {
  const tone = v === "public" ? "success" : v === "password" ? "warn" : "info";
  return <Pill tone={tone}>{VIS_LABELS[v] || v}</Pill>;
}

function SyncBadge({ s }) {
  if (s === "ok") return <Pill tone="success">同步正常</Pill>;
  if (s === "syncing") return <Pill tone="warn">同步中</Pill>;
  if (s === "failed") return <Pill tone="danger">同步失败</Pill>;
  return <Pill tone="muted">仅手动</Pill>;
}

function syncModeText(app) {
  const wh = !!app.syncWebhookEnabled;
  const poll = !!app.syncPollEnabled;
  if (wh && poll) return "Webhook+轮询";
  if (wh) return "仅 Webhook";
  if (poll) return "仅轮询";
  return "手动";
}

function SyncModeLabel({ app }) {
  const text = syncModeText(app);
  const tone = text === "手动" ? "muted" : text === "Webhook+轮询" ? "accent" : "info";
  return <Pill tone={tone}>{text}</Pill>;
}

function StatusJob({ s }) {
  const map = { success: "success", running: "warn", failed: "danger", queued: "muted" };
  const label = { success: "成功", running: "运行中", failed: "失败", queued: "排队" };
  return <Pill tone={map[s] || "muted"}>{label[s] || s}</Pill>;
}

function Modal({ open, title, children, onClose, footer }) {
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onClose} data-od-id="modal-backdrop">
      <div className="modal" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true">
        <div className="modal-hd">{title}</div>
        <div className="modal-bd">{children}</div>
        {footer && <div className="modal-ft">{footer}</div>}
      </div>
    </div>
  );
}

function Toast({ msg, onDone }) {
  useEffect(() => {
    if (!msg) return;
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, [msg, onDone]);
  if (!msg) return null;
  return <div className="toast ok" data-od-id="toast"><Icon d={I.check} size={14} />{msg}</div>;
}

function groupAssets(assets) {
  const g = {};
  PLATFORM_ORDER.forEach(p => { g[p] = []; });
  (assets || []).forEach(a => { (g[a.platform] || (g[a.platform] = [])).push(a); });
  return PLATFORM_ORDER.filter(p => g[p]?.length).map(p => ({ platform: p, assets: g[p] }));
}

const RELEASE_PROVIDERS = [
  { id: "none", label: "无（纯手动上传）", implemented: true },
  { id: "github", label: "GitHub Release", implemented: true },
  { id: "gitee", label: "Gitee Release（二期）", implemented: false },
  { id: "gitlab", label: "GitLab Release（二期）", implemented: false },
];

function providerMeta(id) {
  return RELEASE_PROVIDERS.find(p => p.id === id) || RELEASE_PROVIDERS[0];
}

function providerLabel(id) {
  const m = { none: "手动", github: "GitHub", gitee: "Gitee", gitlab: "GitLab" };
  return m[id] || id || "手动";
}

function releaseRef(app) {
  if (!app || !app.releaseProvider || app.releaseProvider === "none") return null;
  const owner = app.releaseOwner || app.github?.owner;
  const repo = app.releaseRepo || app.github?.repo;
  if (!owner || !repo) return null;
  return { provider: app.releaseProvider, owner, repo, baseUrl: app.releaseBaseUrl || "" };
}

function formatReleaseRef(app) {
  const r = releaseRef(app);
  if (!r) return "纯手动上传";
  const base = r.baseUrl ? ` @ ${r.baseUrl.replace(/^https?:\/\//, "")}` : "";
  return `${providerLabel(r.provider)} · ${r.owner}/${r.repo}${base}`;
}

function webhookPathFor(provider) {
  if (provider === "github") return "/api/v1/hooks/github";
  if (provider === "gitee") return "/api/v1/hooks/gitee";
  if (provider === "gitlab") return "/api/v1/hooks/gitlab";
  return null;
}

function canProviderAutoSync(app) {
  const r = releaseRef(app);
  if (!r) return false;
  return !!providerMeta(r.provider).implemented && !!app.syncEnabled;
}

function detectPlatformFromUA() {
  const ua = (navigator.userAgent || "").toLowerCase();
  if (/android/.test(ua)) return "Android";
  if (/iphone|ipad|ipod/.test(ua)) return "iOS";
  if (/mac os x|macintosh/.test(ua)) return "macOS";
  if (/linux/.test(ua)) return "Linux";
  if (/windows|win64|win32/.test(ua)) return "Windows";
  return "Windows";
}

function pickStableLatest(versions, showPrerelease) {
  const list = versions || [];
  if (showPrerelease) return list[0];
  return list.find(v => !v.isPrerelease) || list[0];
}

function pickPrimaryAsset(assets, preferredPlatform) {
  if (!assets?.length) return null;
  return assets.find(a => a.platform === preferredPlatform) || assets[0];
}

async function copyText(text, toast, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    toast?.(okMsg || "已复制");
  } catch {
    toast?.("复制失败，请手动选择");
  }
}

function PasswordGate({ app, accessCodes, onUnlock }) {
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const bound = (accessCodes || []).filter(c => (c.appIds || []).includes(app.id));
  const hasActive = bound.some(c => isCodeUsable(c, app.id));
  return (
    <div className="auth-wrap" data-od-id="page-password-gate">
      <div className="auth-card">
        <Logo word={false} />
        <h1>需要访问口令</h1>
        <p className="lead">「{app.name}」为口令可见。请输入管理员签发的访问口令继续（仅解锁下载站）。</p>
        {!hasActive && (
          <div className="hint" style={{ marginBottom: 12, color: "var(--warn)" }}>当前应用尚未绑定可用口令，请联系管理员在「访问口令」中心签发。</div>
        )}
        <div className="auth-stack">
          <div className="field">
            <label>访问口令</label>
            <input className="input mono" type="password" value={pwd} onChange={e => { setPwd(e.target.value); setErr(""); }} placeholder="例如 dock_demo_forge_2026" autoFocus data-od-id="gate-code-input" />
            {err && <span style={{ color: "var(--danger)", fontSize: 12 }}>{err}</span>}
            <div className="hint">演示可用：dock_demo_forge_2026</div>
          </div>
          <button type="button" className="btn btn-primary btn-block" data-od-id="gate-submit" onClick={() => {
            const raw = pwd.trim();
            if (!raw) { setErr("请输入访问口令"); return; }
            const hit = (accessCodes || []).find(c => c.plainCode === raw && isCodeUsable(c, app.id));
            if (!hit) { setErr("口令无效或已失效"); return; }
            onUnlock(app.slug, hit.id);
          }}>继续访问</button>
          <Link to="/" className="btn btn-ghost btn-block">返回首页</Link>
        </div>
      </div>
    </div>
  );
}

  const [pollInterval, setPollInterval] = useState(app.syncPollIntervalMin === "" || app.syncPollIntervalMin == null ? "" : String(app.syncPollIntervalMin));
  const [notifyForm, setNotifyForm] = useState({
    notifyEnabled: !!app.notifyEnabled,
    notifyOnSyncSuccess: !!app.notifyOnSyncSuccess,
    notifyOnSyncFailure: !!app.notifyOnSyncFailure,
    notifyOnManualUpload: !!app.notifyOnManualUpload,
    notifyEmails: app.notifyEmails || "",
    notifyMembers: !!app.notifyMembers,
    notifyMemberRoles: [...(app.notifyMemberRoles || [])],
    notifyUseGlobalFallback: app.notifyUseGlobalFallback !== false,
  });
  const fileRef = useRef(null);
  const canAutoSync = canProviderAutoSync(app);
  const providerImpl = providerMeta(app.releaseProvider || "none").implemented;
  const manualOnly = (!webhookOn && !pollOn) || !canAutoSync;
  const hookPath = webhookPathFor(app.releaseProvider);
  const boundCodes = (accessCodes || []).filter(c => (c.appIds || []).includes(app.id));
  const ROLE_OPTS = [
    { id: "manager", label: "manager" },
    { id: "operator", label: "operator" },
    { id: "viewer", label: "viewer" },
  ];

  const persistSync = (nextWh, nextPoll, nextInterval) => {
    if (onPatchApp) {
      onPatchApp(app.id, {
        syncWebhookEnabled: nextWh,
        syncPollEnabled: nextPoll,
        syncPollIntervalMin: nextInterval === "" ? "" : Number(nextInterval),
        syncStatus: (nextWh || nextPoll) && canAutoSync ? (app.syncStatus === "manual" ? "ok" : app.syncStatus) : "manual",
      });
    }
  };

  const saveNotify = () => {
    if (onPatchApp) onPatchApp(app.id, { ...notifyForm });
    onToast("通知设置已保存");
  };

  const toggleNotifyRole = (role) => {
    setNotifyForm(f => ({
      ...f,
      notifyMemberRoles: f.notifyMemberRoles.includes(role)
        ? f.notifyMemberRoles.filter(r => r !== role)
        : [...f.notifyMemberRoles, role],
    }));
  };

  const addFiles = (list) => {
    const arr = Array.from(list || []);
    let pendingOverwrite = null;
    setFiles(prev => {
      const next = [...prev];
      arr.forEach(f => {
        const dup = next.find(x => x.name === f.name);
        if (dup) pendingOverwrite = { incoming: f, existing: dup };
        else next.push({ name: f.name, size: ((f.size || 0) / 1024 / 1024).toFixed(1) + " MB", file: f });
      });
      return next;
    });
    if (pendingOverwrite) setOverwrite(pendingOverwrite);
  };

  const confirmOverwrite = () => {
    if (!overwrite) return;
    const f = overwrite.incoming;
    setFiles(fs => {
      const filtered = fs.filter(x => x.name !== f.name);
      return [...filtered, { name: f.name, size: ((f.size || 0) / 1024 / 1024).toFixed(1) + " MB", file: f }];
    });
    setOverwrite(null);
    onToast("已覆盖同名文件");
  };

  return (
    <div data-od-id={`page-admin-app-${app.slug}`}>

          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Link to={`/admin/apps/${app.id}/edit`} className="btn btn-sm">编辑</Link>
          <button type="button" className="btn btn-sm" onClick={() => {
            if (!releaseRef(app)) { onToast("未绑定同步源，请手动上传"); return; }
            if (!providerImpl) { onToast("PROVIDER_NOT_IMPLEMENTED · 二期"); return; }
            onSync(app.id); onToast("已触发手动同步");
          }} disabled={!releaseRef(app)}><Icon d={I.sync} size={14} />手动同步</button>
          <button type="button" className="btn btn-sm" data-od-id="btn-archive" onClick={() => {
            const next = app.status === "archived" ? "active" : "archived";
            onPatchApp && onPatchApp(app.id, { status: next, syncEnabled: next === "archived" ? false : app.syncEnabled });
            onToast(next === "archived" ? "已归档（对外 404/410）" : "已取消归档");
          }}>{app.status === "archived" ? "取消归档" : "归档"}</button>
          <Link to={`/a/${app.slug}`} className="btn btn-sm">预览下载页</Link>
        </div>
      </div>
      {app.status === "archived" && (
        <div className="hint" style={{ marginBottom: 12, color: "var(--warn)" }}>此应用已归档：同步已停；对外下载站返回归档空状态。</div>
      )}
      <div className="tabs" data-od-id="app-detail-tabs">
        {[["overview", "概览"], ["versions", "版本"], ["upload", "手动上传"], ["members", "成员授权"], ["sync", "同步"], ["notify", "通知"]].map(([k, l]) => (

              <SyncModeLabel app={{ ...app, syncWebhookEnabled: webhookOn, syncPollEnabled: pollOn }} />

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
              <div style={{ padding: 12, borderRadius: 8, border: "1px solid var(--border)", background: "var(--surface-2)" }}>
                <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 4 }}>Webhook</div>
                <div className="muted" style={{ fontSize: 12, lineHeight: 1.5 }}>近实时 · {providerLabel(app.releaseProvider)} Release 推送</div>
                <div style={{ marginTop: 8 }}>{webhookOn && canAutoSync ? <Pill tone="success">已启用</Pill> : <Pill tone="muted">未启用</Pill>}</div>
              </div>
              <div style={{ padding: 12, borderRadius: 8, border: "1px solid var(--border)", background: "var(--surface-2)" }}>
                <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 4 }}>定时轮询</div>
                <div className="muted" style={{ fontSize: 12, lineHeight: 1.5 }}>兜底 · 尤其无公网时</div>
                <div style={{ marginTop: 8 }}>{pollOn && canAutoSync ? <Pill tone="success">已启用</Pill> : <Pill tone="muted">未启用</Pill>}</div>
              </div>
              <div style={{ padding: 12, borderRadius: 8, border: "1px solid var(--border)", background: "var(--surface-2)" }}>
                <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 4 }}>手动同步</div>
                <div className="muted" style={{ fontSize: 12, lineHeight: 1.5 }}>随时可点顶部「手动同步」</div>
                <div style={{ marginTop: 8 }}><Pill tone="accent">始终可用</Pill></div>
              </div>
            </div>
            {manualOnly && (
              <div className="hint" style={{ marginTop: 12 }}>当前未启用 Webhook / 轮询{!releaseRef(app) ? "，且未绑定同步源" : (!providerImpl ? "（当前 Provider 二期未实现）" : "")}，版本更新依赖手动上传或手动同步。</div>
            )}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <div className="card card-pad">
              <div className="panel-title">状态</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, fontSize: 13 }}>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">状态</span>{app.status === "archived" ? <Pill tone="warn">已归档</Pill> : <Pill tone="success">活跃</Pill>}</div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">可见性</span><VisBadge v={app.visibility} /></div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">同步源</span><span className="mono" style={{ fontSize: 12 }}>{formatReleaseRef(app)}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">同步状态</span><SyncBadge s={app.syncStatus} /></div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">同步模式</span><SyncModeLabel app={{ ...app, syncWebhookEnabled: webhookOn, syncPollEnabled: pollOn }} /></div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">最新版本</span><span className="mono">{app.latest}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">最近同步</span><span className="mono">{app.lastSyncAt}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">Include</span><span className="mono" style={{ fontSize: 12 }}>{app.includeGlob || "—"}</span></div>
              </div>
            </div>
            <div className="card card-pad">
              <div className="panel-title">简介</div>
              <p style={{ fontSize: 14, color: "var(--muted)" }}>{app.summary}</p>
            </div>
          </div>
          {app.visibility === "password" && (
            <div className="card card-pad" data-od-id="bound-access-codes">
              <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span>绑定的访问口令</span>
                <Link to="/admin/access-codes" className="btn btn-sm">去口令中心</Link>
              </div>
              {boundCodes.length === 0 ? (
                <div className="hint">尚未绑定任何访问口令。设为「口令」可见后须在口令中心签发并绑定，否则对外无法解锁。</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {boundCodes.map(c => (
                    <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 12, fontSize: 13, padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)", background: "var(--surface-2)" }}>
                      <span className="mono">{maskCodePrefix(c.codePrefix)}</span>
                      {c.status === "active" && !isCodeExpired(c) ? <Pill tone="success">启用</Pill> : <Pill tone="muted">{c.status === "disabled" ? "停用" : "失效"}</Pill>}
                      <span className="muted" style={{ flex: 1 }}>{c.note}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {tab === "versions" && (
        <div className="table-wrap">
          <table className="data">
            <thead><tr><th>Tag</th><th>标记</th><th>发布日期</th><th>资产数</th><th></th></tr></thead>
            <tbody>
              {app.versions.map(v => (
                <tr key={v.tag} style={{ opacity: v.status === "yanked" ? 0.55 : 1 }}>
                  <td className="mono">{v.tag}</td>
                  <td style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                    {v.isPrerelease && <Pill tone="warn">预发布</Pill>}
                    {v.status === "yanked" && <Pill tone="danger">已 Yank</Pill>}
                    {v.source === "manual" && <Pill tone="muted">手动</Pill>}
                  </td>
                  <td>{v.publishedAt}</td>
                  <td>{(v.assets || []).length}</td>
                  <td style={{ display: "flex", gap: 6 }}>
                    <Link to={`/a/${app.slug}/v/${v.tag}`} className="btn btn-sm">查看</Link>
                    <button type="button" className="btn btn-sm" disabled={v.status === "yanked"} onClick={() => {
                      onPatchApp && onPatchApp(app.id, {
                        versions: app.versions.map(x => x.tag === v.tag ? { ...x, status: "yanked" } : x),
                      });
                      onToast(`已 yank ${v.tag}`);
                    }}>Yank</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab === "upload" && (
        <div data-od-id="upload-panel">
          <div className="filter-chips" style={{ marginBottom: 16 }}>
            <button type="button" className={`chip ${uploadMode === "new" ? "active" : ""}`} onClick={() => setUploadMode("new")}>新建版本 + 多文件</button>
            <button type="button" className={`chip ${uploadMode === "append" ? "active" : ""}`} onClick={() => setUploadMode("append")}>向已有版本补传</button>
          </div>
          {uploadMode === "new" ? (
            <div className="form-grid" style={{ marginBottom: 14, maxWidth: 720 }}>
              <div className="field"><label>版本 Tag</label><input className="input mono" placeholder="v1.0.0" value={tag} onChange={e => setTag(e.target.value)} /></div>
              <div className="field"><label>标题</label><input className="input" placeholder="可选，默认=Tag" value={uploadTitle} onChange={e => setUploadTitle(e.target.value)} /></div>
              <div className="field span-2"><label>Changelog</label><textarea className="textarea" rows={3} placeholder="Markdown 发布说明" value={uploadChangelog} onChange={e => setUploadChangelog(e.target.value)} /></div>
              <div className="span-2 switch-row">
                <div><div style={{ fontWeight: 500 }}>标记为预发布</div><div className="hint">isPrerelease · 下载站默认隐藏</div></div>
                <label className="switch"><input type="checkbox" checked={uploadPrerelease} onChange={e => setUploadPrerelease(e.target.checked)} /><span /></label>
              </div>
            </div>
          ) : (
            <div className="field" style={{ maxWidth: 320, marginBottom: 14 }}>
              <label>目标版本</label>
              <select className="select" value={tag || app.versions[0]?.tag} onChange={e => setTag(e.target.value)}>
                {app.versions.map(v => <option key={v.tag} value={v.tag}>{v.tag}{v.status === "yanked" ? " (yanked)" : ""}</option>)}
              </select>
            </div>
          )}
          <div
            className={`dropzone ${drag ? "drag" : ""}`}
            data-od-id="dropzone"
            onDragOver={e => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={e => { e.preventDefault(); setDrag(false); addFiles(e.dataTransfer.files); }}
            onClick={() => fileRef.current?.click()}
          >
            <Icon d={I.upload} size={28} />
            <div className="dz-title" style={{ marginTop: 10 }}>拖拽安装包到此处，或点击选择</div>
            <div className="muted" style={{ fontSize: 13 }}>支持多文件 · 可指定 platform/arch · 同名将二次确认覆盖</div>
            <input ref={fileRef} type="file" multiple hidden onChange={e => addFiles(e.target.files)} />
          </div>
          {files.length > 0 && (
            <div className="file-list" data-od-id="upload-file-list">
              {files.map(f => (
                <div key={f.name} className="file-row" style={{ flexWrap: "wrap" }}>
                  <Icon d={I.apps} size={16} />
                  <span className="name" title={f.name}>{f.name}</span>
                  <span className="mono muted" style={{ fontSize: 12 }}>{f.size}</span>
                  <select className="select" style={{ width: 120 }} value={f.platform || "auto"} onChange={e => setFiles(fs => fs.map(x => x.name === f.name ? { ...x, platform: e.target.value } : x))}>
                    <option value="auto">平台·推断</option>
                    {PLATFORM_ORDER.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  <select className="select" style={{ width: 110 }} value={f.arch || "auto"} onChange={e => setFiles(fs => fs.map(x => x.name === f.name ? { ...x, arch: e.target.value } : x))}>
                    <option value="auto">架构·推断</option>
                    <option value="x64">x64</option>
                    <option value="arm64">arm64</option>
                    <option value="universal">universal</option>
                  </select>
                  <button type="button" className="btn btn-ghost btn-sm" onClick={() => setFiles(fs => fs.filter(x => x.name !== f.name))}><Icon d={I.x} size={14} /></button>
                </div>
              ))}
              <button type="button" className="btn btn-primary" style={{ alignSelf: "flex-start", marginTop: 8 }} onClick={() => {
                if (uploadMode === "new" && !tag) { onToast("请填写版本 Tag"); return; }
                onToast(`已提交上传 ${files.length} 个文件 → ${tag || "补传"}${uploadPrerelease ? " · 预发布" : ""}`);
                setFiles([]); setUploadTitle(""); setUploadChangelog(""); setUploadPrerelease(false);
              }}>提交上传</button>
            </div>
          )}
          <Modal
            open={!!overwrite}
            title="确认覆盖同名文件？"
            onClose={() => setOverwrite(null)}
            footer={
              <>
                <button type="button" className="btn" onClick={() => setOverwrite(null)}>取消</button>
                <button type="button" className="btn btn-danger" data-od-id="overwrite-confirm" onClick={confirmOverwrite}>覆盖 Overwrite</button>
              </>
            }
          >
            文件 <span className="mono">{overwrite?.incoming?.name}</span> 已在列表中。继续将替换本地待上传文件，此操作不可撤销（示意）。
          </Modal>
        </div>
      )}

      {tab === "members" && (
        <div data-od-id="members-panel">
          <div className="card card-pad" style={{ marginBottom: 16 }}>
            <div className="panel-title">添加成员</div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <select className="select" style={{ width: 220 }} value={addUser} onChange={e => setAddUser(e.target.value)}>
                <option value="">选择用户…</option>
                {users.filter(u => !members.some(m => m.userId === u.id)).map(u => (
                  <option key={u.id} value={u.id}>{u.name} · {u.email}</option>
                ))}
              </select>
              <select className="select" style={{ width: 180 }} value={addRole} onChange={e => setAddRole(e.target.value)}>
                <option value="viewer">viewer 查看者</option>
                <option value="operator">operator 操作员</option>
                <option value="manager">manager 管理员</option>
              </select>
              <button type="button" className="btn btn-primary" onClick={() => {
                const u = users.find(x => x.id === addUser);
                if (!u) return;
                setMembers(m => [...m, { userId: u.id, name: u.name, email: u.email, role: addRole }]);
                setAddUser("");
                onToast(`已添加 ${u.name}`);
              }}>添加</button>
            </div>
          </div>
          {members.map(m => (
            <div key={m.userId} className="member-row" data-od-id={`member-${m.userId}`}>
              <span className="avatar">{m.name.slice(0, 1)}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600 }}>{m.name}</div>
                <div className="muted" style={{ fontSize: 12 }}>{m.email}</div>
              </div>
              <select className="select" style={{ width: 160 }} value={m.role} onChange={e => setMembers(ms => ms.map(x => x.userId === m.userId ? { ...x, role: e.target.value } : x))}>
                <option value="viewer">viewer</option>
                <option value="operator">operator</option>
                <option value="manager">manager</option>
              </select>
              <button type="button" className="btn btn-ghost btn-sm" onClick={() => setMembers(ms => ms.filter(x => x.userId !== m.userId))}>移除</button>
            </div>
          ))}
        </div>
      )}

      {tab === "sync" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }} data-od-id="sync-panel">
          {!canAutoSync && (
            <div className="card card-pad" style={{ borderColor: "oklch(78% 0.12 85 / 0.4)" }}>
              <div style={{ fontSize: 13, color: "var(--warn)" }}>
                {!releaseRef(app)
                  ? "未绑定同步源 — 仅手动上传。"
                  : !providerImpl
                    ? `${providerLabel(app.releaseProvider)} 一期未实现（PROVIDER_NOT_IMPLEMENTED）— 可保存配置，不可自动同步。`
                    : "应用级自动同步总开关已关闭 — 仅手动上传。"}
                {" "}可在「编辑」中修改同步源。
              </div>
            </div>
          )}
          <div className="card card-pad" data-od-id="sync-webhook-section">
            <div className="panel-title">Webhook（近实时）</div>
            <div className="switch-row" style={{ marginBottom: 14, opacity: canAutoSync ? 1 : 0.45, pointerEvents: canAutoSync ? "auto" : "none" }}>
              <div><div style={{ fontWeight: 500 }}>接受 Webhook</div><div className="hint">{providerLabel(app.releaseProvider)} Release 事件推送到本站 · syncWebhookEnabled</div></div>
              <label className="switch"><input type="checkbox" checked={webhookOn} disabled={!canAutoSync} onChange={e => { const v = e.target.checked; setWebhookOn(v); persistSync(v, pollOn, pollInterval); onToast(v ? "已开启 Webhook" : "已关闭 Webhook"); }} /><span /></label>
            </div>
            <ol style={{ paddingLeft: 18, color: "var(--muted)", fontSize: 14, lineHeight: 1.7, marginBottom: 14 }}>
              <li>在 {providerLabel(app.releaseProvider)} 仓库 Settings → Webhooks 新建 Hook</li>
              <li>Payload URL 填入下方地址，Content type 选 <span className="mono">application/json</span></li>
              <li>事件勾选 <strong style={{ color: "var(--fg)" }}>Releases</strong>（各平台名称可能不同）</li>
              <li>Secret 与系统设置中的 Webhook Secret 保持一致</li>
            </ol>
            <div className="webhook-box">https://dl.example.com{hookPath || "/api/v1/hooks/…"}</div>
            <button type="button" className="btn btn-sm" style={{ marginTop: 12 }} onClick={() => onToast(hookPath ? "已复制 Webhook URL" : "当前 Provider 无 Hook 路径")} disabled={!hookPath}><Icon d={I.copy} size={14} />复制 URL</button>
          </div>
          <div className="card card-pad" data-od-id="sync-poll-section">
            <div className="panel-title">定时轮询（兜底）</div>
            <div className="switch-row" style={{ marginBottom: 14, opacity: canAutoSync ? 1 : 0.45, pointerEvents: canAutoSync ? "auto" : "none" }}>
              <div><div style={{ fontWeight: 500 }}>参与定时轮询</div><div className="hint">无公网 / 收不到 Webhook 时依赖轮询 · syncPollEnabled</div></div>
              <label className="switch"><input type="checkbox" checked={pollOn} disabled={!canAutoSync} onChange={e => { const v = e.target.checked; setPollOn(v); persistSync(webhookOn, v, pollInterval); onToast(v ? "已开启轮询" : "已关闭轮询"); }} /><span /></label>
            </div>
            <div className="field" style={{ maxWidth: 280, opacity: canAutoSync && pollOn ? 1 : 0.45 }}>
              <label>轮询间隔覆盖（分钟）</label>
              <input
                className="input mono"
                value={pollInterval}
                disabled={!canAutoSync || !pollOn}
                placeholder={`留空 = 系统默认 ${settings?.pollIntervalMin ?? 15}`}
                onChange={e => setPollInterval(e.target.value.replace(/[^\d]/g, ""))}
                onBlur={() => { persistSync(webhookOn, pollOn, pollInterval); if (pollInterval !== "") onToast(`轮询间隔已设为 ${pollInterval} 分钟`); }}
              />
              <div className="hint">留空则使用系统设置默认值（当前 {settings?.pollIntervalMin ?? 15} 分钟）</div>
            </div>
          </div>
          {manualOnly && (
            <div className="card card-pad" data-od-id="sync-manual-only-hint">
              <div style={{ fontSize: 13, color: "var(--muted)" }}>两个自动同步开关均未启用（或未绑定已实现同步源）— <strong style={{ color: "var(--fg)" }}>仅手动上传 / 手动同步</strong>。</div>
            </div>
          )}
        </div>
      )}

      {tab === "notify" && (
        <div className="card card-pad" style={{ maxWidth: 640 }} data-od-id="app-notify-tab">
          <div className="panel-title">邮件通知</div>
          <div className="hint" style={{ marginBottom: 14 }}>经 notify 队列异步发送。成功类邮件正文含各平台 AppDock 下载链接（非 GitHub）。</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <div className="switch-row" data-od-id="notify-master">
              <div>
                <div style={{ fontWeight: 500 }}>启用通知</div>
                <div className="hint">关闭后本应用不入队邮件任务</div>
              </div>
              <label className="switch"><input type="checkbox" checked={notifyForm.notifyEnabled} onChange={e => setNotifyForm(f => ({ ...f, notifyEnabled: e.target.checked }))} /><span /></label>
            </div>
            <div style={{ opacity: notifyForm.notifyEnabled ? 1 : 0.45, pointerEvents: notifyForm.notifyEnabled ? "auto" : "none", display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <div style={{ fontWeight: 500, fontSize: 13, marginBottom: 8 }}>事件</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {[
                    ["notifyOnSyncSuccess", "同步成功"],
                    ["notifyOnSyncFailure", "同步失败"],
                    ["notifyOnManualUpload", "手动上传成功"],
                  ].map(([k, label]) => (
                    <label key={k} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" }}>
                      <input type="checkbox" checked={!!notifyForm[k]} onChange={e => setNotifyForm(f => ({ ...f, [k]: e.target.checked }))} />
                      <span>{label}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div className="field">
                <label>自定义收件人</label>
                <textarea className="textarea mono" rows={3} value={notifyForm.notifyEmails} onChange={e => setNotifyForm(f => ({ ...f, notifyEmails: e.target.value }))} placeholder="每行一个邮箱" data-od-id="notify-emails" />
              </div>
              <div className="switch-row">
                <div>
                  <div style={{ fontWeight: 500 }}>通知应用成员</div>
                  <div className="hint">按下方角色过滤成员邮箱</div>
                </div>
                <label className="switch"><input type="checkbox" checked={notifyForm.notifyMembers} onChange={e => setNotifyForm(f => ({ ...f, notifyMembers: e.target.checked }))} /><span /></label>
              </div>
              {notifyForm.notifyMembers && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 12, paddingLeft: 4 }}>
                  {ROLE_OPTS.map(r => (
                    <label key={r.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, cursor: "pointer" }}>
                      <input type="checkbox" checked={notifyForm.notifyMemberRoles.includes(r.id)} onChange={() => toggleNotifyRole(r.id)} />
                      <span className="mono">{r.label}</span>
                    </label>
                  ))}
                </div>
              )}
              <div className="switch-row">
                <div>
                  <div style={{ fontWeight: 500 }}>自定义为空时使用全局默认</div>
                  <div className="hint">回落到系统设置中的默认收件人</div>
                </div>
                <label className="switch"><input type="checkbox" checked={notifyForm.notifyUseGlobalFallback} onChange={e => setNotifyForm(f => ({ ...f, notifyUseGlobalFallback: e.target.checked }))} /><span /></label>
              </div>
              <div className="hint">收件人 = 自定义邮箱 ∪ 成员角色 ∪ 全局回落（去重）</div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button type="button" className="btn btn-primary" data-od-id="notify-save" onClick={saveNotify}>保存</button>
              <button type="button" className="btn" data-od-id="notify-test" onClick={() => onToast("已发送测试通知（示意）")} disabled={!notifyForm.notifyEnabled}>发送测试通知</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AccessCodesPage({ codes, setCodes, apps, onToast, adminUser }) {
  const [createOpen, setCreateOpen] = useState(false);
  const [editBind, setEditBind] = useState(null);
  const [reveal, setReveal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [form, setForm] = useState({
    note: "", expiresAt: "", maxUses: "", appIds: [], customMode: false, customCode: "",
  });
  const pwdApps = apps.filter(a => a.visibility === "password");
  const appMap = Object.fromEntries(apps.map(a => [a.id, a]));

  const resetForm = () => setForm({ note: "", expiresAt: "", maxUses: "", appIds: [], customMode: false, customCode: "" });

  const toggleApp = (id) => setForm(f => ({
    ...f,
    appIds: f.appIds.includes(id) ? f.appIds.filter(x => x !== id) : [...f.appIds, id],
  }));

  const submitCreate = () => {
    if (!form.note.trim()) { onToast("请填写备注"); return; }
    if (form.appIds.length === 0) { onToast("请至少绑定一个口令应用"); return; }
    let plain, prefix;
    if (form.customMode) {
      plain = form.customCode.trim();
      if (plain.length < 8) { onToast("自定义口令至少 8 位"); return; }
      prefix = plain.slice(0, 8);
    } else {
      const g = genAccessCode();
      plain = g.plain;
      prefix = g.prefix;
    }
    const row = {
      id: "ac_" + Date.now(),
      note: form.note.trim(),
      codePrefix: prefix,
      plainCode: plain,
      status: "active",
      expiresAt: form.expiresAt ? form.expiresAt.replace("T", " ") : "",
      maxUses: form.maxUses === "" ? null : Number(form.maxUses),
      usedCount: 0,
      appIds: [...form.appIds],
      createdBy: adminUser?.name || "管理员",
      lastUsedAt: "—",
    };
    setCodes(ls => [row, ...ls]);
    setCreateOpen(false);
    resetForm();
    setReveal({ plain, note: row.note, kind: "create" });
  };

  const doRotate = (c) => {
    const g = genAccessCode();
    setCodes(ls => ls.map(x => x.id === c.id ? { ...x, codePrefix: g.prefix, plainCode: g.plain, usedCount: 0, lastUsedAt: "—" } : x));
    setReveal({ plain: g.plain, note: c.note, kind: "rotate" });
    onToast("口令已轮换");
  };

  const copyPlain = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      onToast("已复制口令");
    } catch {
      onToast("复制失败，请手动选择");
    }
  };

  const usesLabel = (c) => {
    if (c.maxUses == null) return `${c.usedCount} / ∞`;
    return `${c.usedCount} / ${c.maxUses}`;
  };

  return (
    <div data-od-id="page-admin-access-codes">
      <div className="page-hd">
        <div>
          <h1>访问口令</h1>
          <div className="sub">全局签发 · 一条口令可绑定多个「口令」可见应用 · 仅解锁下载站</div>
        </div>
        <button type="button" className="btn btn-primary" data-od-id="ac-create-btn" onClick={() => { resetForm(); setCreateOpen(true); }}>
          <Icon d={I.plus} size={15} />签发口令
        </button>
      </div>
      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th>备注</th><th>前缀</th><th>状态</th><th>过期</th><th>次数</th><th>绑定应用</th><th>创建人</th><th>最近使用</th><th></th>
            </tr>
          </thead>
          <tbody>
            {codes.map(c => {
              const expired = isCodeExpired(c);
              const statusTone = c.status !== "active" ? "muted" : expired ? "warn" : "success";
              const statusLabel = c.status !== "active" ? "停用" : expired ? "已过期" : "启用";
              return (
                <tr key={c.id} data-od-id={`ac-row-${c.id}`}>
                  <td style={{ fontWeight: 600 }}>{c.note}</td>
                  <td className="mono" style={{ fontSize: 12 }}>{maskCodePrefix(c.codePrefix)}</td>
                  <td><Pill tone={statusTone}>{statusLabel}</Pill></td>
                  <td className="mono muted" style={{ fontSize: 12 }}>{c.expiresAt || "不过期"}</td>
                  <td className="mono" style={{ fontSize: 12 }}>{usesLabel(c)}</td>
                  <td>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                      {(c.appIds || []).map(id => appMap[id] ? <Pill key={id} tone="info">{appMap[id].name}</Pill> : null)}
                      {(c.appIds || []).length === 0 && <span className="muted">—</span>}
                    </div>
                  </td>
                  <td>{c.createdBy}</td>
                  <td className="mono muted" style={{ fontSize: 12 }}>{c.lastUsedAt || "—"}</td>
                  <td>
                    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                      <button type="button" className="btn btn-sm" onClick={() => {
                        setCodes(ls => ls.map(x => x.id === c.id ? { ...x, status: x.status === "active" ? "disabled" : "active" } : x));
                        onToast(c.status === "active" ? "已停用" : "已启用");
                      }}>{c.status === "active" ? "停用" : "启用"}</button>
                      <button type="button" className="btn btn-sm" onClick={() => setEditBind({ id: c.id, appIds: [...(c.appIds || [])] })}>编辑绑定</button>
                      <button type="button" className="btn btn-sm" onClick={() => doRotate(c)}>轮换</button>
                      <button type="button" className="btn btn-sm" onClick={() => copyPlain(c.plainCode)}><Icon d={I.copy} size={12} />复制</button>
                      <button type="button" className="btn btn-sm btn-ghost" onClick={() => setDetail(c)}>详情</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <Modal open={createOpen} title="签发访问口令" onClose={() => setCreateOpen(false)} footer={
        <>
          <button type="button" className="btn" onClick={() => setCreateOpen(false)}>取消</button>
          <button type="button" className="btn btn-primary" data-od-id="ac-submit" onClick={submitCreate}>签发</button>
        </>
      }>
        <div className="auth-stack">
          <div className="field"><label>备注</label><input className="input" value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} placeholder="如：Q3 内测群" data-od-id="ac-note" /></div>
          <div className="field"><label>过期时间</label><input className="input" type="datetime-local" value={form.expiresAt} onChange={e => setForm(f => ({ ...f, expiresAt: e.target.value }))} /><div className="hint">留空表示不过期</div></div>
          <div className="field"><label>最大使用次数</label><input className="input mono" value={form.maxUses} onChange={e => setForm(f => ({ ...f, maxUses: e.target.value.replace(/[^\d]/g, "") }))} placeholder="留空 = 不限" /></div>
          <div className="field">
            <label>绑定应用（仅口令可见）</label>
            {pwdApps.length === 0 ? (
              <div className="hint">暂无 visibility=password 的应用</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {pwdApps.map(a => (
                  <label key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" }}>
                    <input type="checkbox" checked={form.appIds.includes(a.id)} onChange={() => toggleApp(a.id)} />
                    <span>{a.name}</span>
                    <span className="mono muted">{a.slug}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
          <div className="switch-row">
            <div><div style={{ fontWeight: 500 }}>自定义口令</div><div className="hint">关闭则由系统生成</div></div>
            <label className="switch"><input type="checkbox" checked={form.customMode} onChange={e => setForm(f => ({ ...f, customMode: e.target.checked }))} /><span /></label>
          </div>
          {form.customMode && (
            <div className="field"><label>自定义明文</label><input className="input mono" value={form.customCode} onChange={e => setForm(f => ({ ...f, customCode: e.target.value }))} placeholder="至少 8 位" /></div>
          )}
        </div>
      </Modal>

      <Modal open={!!editBind} title="编辑绑定应用" onClose={() => setEditBind(null)} footer={
        <>
          <button type="button" className="btn" onClick={() => setEditBind(null)}>取消</button>
          <button type="button" className="btn btn-primary" onClick={() => {
            if (!editBind) return;
            setCodes(ls => ls.map(x => x.id === editBind.id ? { ...x, appIds: [...editBind.appIds] } : x));
            setEditBind(null);
            onToast("绑定已更新");
          }}>保存</button>
        </>
      }>
        {editBind && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pwdApps.map(a => (
              <label key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer" }}>
                <input type="checkbox" checked={editBind.appIds.includes(a.id)} onChange={() => setEditBind(b => ({
                  ...b,
                  appIds: b.appIds.includes(a.id) ? b.appIds.filter(x => x !== a.id) : [...b.appIds, a.id],
                }))} />
                <span>{a.name}</span>
              </label>
            ))}
          </div>
        )}
      </Modal>

      <Modal open={!!reveal} title={reveal?.kind === "rotate" ? "口令已轮换" : "口令已签发"} onClose={() => setReveal(null)} footer={
        <>
          <button type="button" className="btn" onClick={() => reveal && copyPlain(reveal.plain)}><Icon d={I.copy} size={14} />复制口令</button>
          <button type="button" className="btn btn-primary" data-od-id="ac-reveal-done" onClick={() => setReveal(null)}>我已保存</button>
        </>
      }>
        {reveal && (
          <div>
            <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 12 }}>建议立即复制；之后也可在列表中再次复制（生产环境由服务端主密钥解密）。</p>
            <div className="field">
              <label>{reveal.note}</label>
              <div className="mono" style={{ padding: "12px 14px", borderRadius: 8, border: "1px solid var(--accent)", background: "var(--accent-dim)", fontSize: 15, wordBreak: "break-all" }} data-od-id="ac-plain-reveal">{reveal.plain}</div>
            </div>
          </div>
        )}
      </Modal>

      <Modal open={!!detail} title="口令详情" onClose={() => setDetail(null)} footer={
        <>
          <button type="button" className="btn" onClick={() => detail && copyPlain(detail.plainCode)}><Icon d={I.copy} size={14} />复制口令</button>
          <button type="button" className="btn btn-primary" onClick={() => setDetail(null)}>关闭</button>
        </>
      }>
        {detail && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10, fontSize: 13 }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">备注</span><span>{detail.note}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">前缀</span><span className="mono">{maskCodePrefix(detail.codePrefix)}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">状态</span><span>{detail.status}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">过期</span><span className="mono">{detail.expiresAt || "不过期"}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">次数</span><span className="mono">{usesLabel(detail)}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">创建人</span><span>{detail.createdBy}</span></div>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span className="muted">最近使用</span><span className="mono">{detail.lastUsedAt}</span></div>
            <div className="hint" style={{ marginTop: 4 }}>列表可随时 reveal 再复制；生产环境由服务端主密钥解密，无需用户密钥对。</div>
          </div>
        )}
      </Modal>
    </div>
  );
}

      <div className="page-hd">

                    onToast(u.status === "active" ? `已禁用 ${u.name}` : `已启用 ${u.name}`);
