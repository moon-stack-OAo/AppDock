function isSmtpReady(s) {
  return !!(s.smtpHost && s.smtpFromEmail && (s.smtpPasswordSet || s.smtpPasswordDraft));
}

function MailSettingsTab({ settings, setSettings, onToast }) {
  const [pwdDraft, setPwdDraft] = useState("");
  const [testOpen, setTestOpen] = useState(false);
  const firstRecipient = (settings.smtpDefaultRecipients || "").split(/\n/).map(x => x.trim()).filter(Boolean)[0] || "";
  const [testTo, setTestTo] = useState(firstRecipient);
  const ready = isSmtpReady({ ...settings, smtpPasswordDraft: pwdDraft });

  const set = (k, v) => setSettings(s => ({ ...s, [k]: v }));

  const onEncryption = (v) => {
    set("smtpEncryption", v);
    if (v === "ssl_tls" && settings.smtpPort !== 465) {
      set("smtpPort", 465);
      onToast("已建议端口 465（SSL/TLS）");
    } else if (v === "starttls" && settings.smtpPort !== 587) {
      set("smtpPort", 587);
      onToast("已建议端口 587（STARTTLS）");
    }
  };

  const save = () => {
    setSettings(s => ({
      ...s,
      smtpPasswordSet: s.smtpPasswordSet || !!pwdDraft,
    }));
    setPwdDraft("");
    onToast("邮件设置已保存");
  };

  const sendTest = () => {
    const to = (testTo || firstRecipient || "").trim();
    if (!to) { onToast("请填写测试收件人"); return; }
    setTestOpen(false);
    onToast(`测试邮件已发送 → ${to}`);
  };

  return (
    <div className="card card-pad" data-od-id="settings-smtp">
      <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>邮件 / SMTP</span>
        <Pill tone={ready ? "success" : "warn"}>{ready ? "已配置" : "未配置"}</Pill>
      </div>
      <div className="hint" style={{ marginBottom: 14 }}>以管理端配置为准；密码只写不回显。</div>
      <div className="form-grid">
        <div className="span-2">
          <div className="switch-row">
            <div>
              <div style={{ fontWeight: 500 }}>启用邮件通知</div>
              <div className="hint">关闭后队列仍可入队但不发送</div>
            </div>
            <label className="switch" data-od-id="smtp-enabled"><input type="checkbox" checked={!!settings.smtpEnabled} onChange={e => set("smtpEnabled", e.target.checked)} /><span /></label>
          </div>
        </div>
        <div className="field">
          <label>SMTP Host</label>
          <input className="input mono" value={settings.smtpHost || ""} onChange={e => set("smtpHost", e.target.value)} placeholder="smtp.example.com" data-od-id="smtp-host" />
        </div>
        <div className="field">
          <label>Port</label>
          <input className="input mono" type="number" value={settings.smtpPort ?? 465} onChange={e => set("smtpPort", Number(e.target.value))} data-od-id="smtp-port" />
          <div className="hint">465 常配 SSL/TLS；587 常配 STARTTLS</div>
        </div>
        <div className="field">
          <label>加密方式</label>
          <select className="select" value={settings.smtpEncryption || "ssl_tls"} onChange={e => onEncryption(e.target.value)} data-od-id="smtp-encryption">
            <option value="ssl_tls">SSL/TLS</option>
            <option value="starttls">STARTTLS</option>
            <option value="none">无</option>
          </select>
        </div>
        <div className="field">
          <label>连接超时（秒）</label>
          <input className="input mono" type="number" value={settings.smtpConnectTimeoutSec ?? 15} onChange={e => set("smtpConnectTimeoutSec", Number(e.target.value))} />
        </div>
        <div className="field">
          <label>用户名</label>
          <input className="input mono" value={settings.smtpUsername || ""} onChange={e => set("smtpUsername", e.target.value)} />
        </div>
        <div className="field">
          <label>密码</label>
          <input
            className="input mono"
            type="password"
            value={pwdDraft}
            onChange={e => setPwdDraft(e.target.value)}
            placeholder={settings.smtpPasswordSet ? "已设置，留空则不修改" : "输入 SMTP 密码"}
            autoComplete="new-password"
            data-od-id="smtp-password"
          />
          <div className="hint">{settings.smtpPasswordSet ? "已设置；留空保存则保留原密码" : "保存后密码不会回显"}</div>
        </div>
        <div className="field">
          <label>发件人名称</label>
          <input className="input" value={settings.smtpFromName || ""} onChange={e => set("smtpFromName", e.target.value)} />
        </div>
        <div className="field">
          <label>发件人邮箱</label>
          <input className="input mono" value={settings.smtpFromEmail || ""} onChange={e => set("smtpFromEmail", e.target.value)} data-od-id="smtp-from-email" />
        </div>
        <div className="field span-2">
          <label>回信地址 Reply-To（可选）</label>
          <input className="input mono" value={settings.smtpReplyTo || ""} onChange={e => set("smtpReplyTo", e.target.value)} placeholder="support@example.com" />
        </div>
        <div className="field span-2">
          <label>全局默认收件人</label>
          <textarea
            className="textarea mono"
            rows={4}
            value={settings.smtpDefaultRecipients || ""}
            onChange={e => set("smtpDefaultRecipients", e.target.value)}
            placeholder="每行一个邮箱"
            data-od-id="smtp-default-recipients"
          />
          <div className="hint">应用级自定义为空且开启回落时使用</div>
        </div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 16, flexWrap: "wrap" }}>
        <button type="button" className="btn btn-primary" onClick={save} data-od-id="smtp-save">保存设置</button>
        <button type="button" className="btn" data-od-id="smtp-test" onClick={() => { setTestTo(firstRecipient); setTestOpen(true); }} disabled={!ready || !settings.smtpEnabled}>发送测试邮件</button>
      </div>
      <Modal
        open={testOpen}
        title="发送测试邮件"
        onClose={() => setTestOpen(false)}
        footer={
          <>
            <button type="button" className="btn" onClick={() => setTestOpen(false)}>取消</button>
            <button type="button" className="btn btn-primary" onClick={sendTest}>发送</button>
          </>
        }
      >
        <div className="field">
          <label>测试收件人</label>
          <input className="input mono" value={testTo} onChange={e => setTestTo(e.target.value)} placeholder="you@example.com" data-od-id="smtp-test-to" />
          <div className="hint">默认取全局收件人第一行</div>
        </div>
      </Modal>
    </div>
  );
}

function SettingsPage({ settings, setSettings, onToast, initialTab }) {
  const tabs = [
    { k: "general", l: "常规" },
    { k: "sync", l: "同步" },
    { k: "mail", l: "邮件" },
  ];
  const valid = tabs.some(t => t.k === initialTab) ? initialTab : "general";
  const [tab, setTab] = useState(valid);
  useEffect(() => {
    if (tabs.some(t => t.k === initialTab)) setTab(initialTab);
  }, [initialTab]);

  const goTab = (k) => {
    setTab(k);
    navigate(k === "general" ? "/admin/settings" : `/admin/settings?tab=${k}`);
  };

  return (
    <div data-od-id="page-admin-settings">
      <div className="page-hd"><div><h1>系统设置</h1><div className="sub">按分类管理系统基础设施</div></div></div>
      <div className="tabs" data-od-id="settings-tabs">
        {tabs.map(({ k, l }) => (
          <button key={k} type="button" className={`tab ${tab === k ? "active" : ""}`} onClick={() => goTab(k)}>{l}</button>
        ))}
      </div>
      <div style={{ maxWidth: 640 }}>
        {tab === "general" && (
          <div className="card card-pad" data-od-id="settings-general">
            <div className="panel-title">站点</div>
            <div className="form-grid">
              <div className="field span-2"><label>站点名称</label><input className="input" value={settings.siteName} onChange={e => setSettings(s => ({ ...s, siteName: e.target.value }))} /></div>
              <div className="field span-2"><label>对外 Base URL</label><input className="input mono" value={settings.publicBaseUrl} onChange={e => setSettings(s => ({ ...s, publicBaseUrl: e.target.value }))} /></div>
              <div className="field"><label>上传大小上限（MB）</label><input className="input mono" type="number" value={settings.uploadMaxMb} onChange={e => setSettings(s => ({ ...s, uploadMaxMb: Number(e.target.value) }))} /></div>
              <div className="field span-2"><label>存储根路径（只读）</label><input className="input mono" value={settings.storageRoot || "/data/files"} readOnly /><div className="hint">来自 APPDOCK_STORAGE_ROOT · 备份须含此目录与 SQLite</div></div>
            </div>
            <button type="button" className="btn btn-primary" style={{ marginTop: 20 }} onClick={() => onToast("设置已保存")}>保存设置</button>
          </div>
        )}
        {tab === "sync" && (
          <div className="card card-pad" data-od-id="settings-sync">
            <div className="panel-title">同步默认与凭据</div>
            <div className="hint" style={{ marginBottom: 14 }}>Token / Secret 来自环境变量，界面仅展示配置态。</div>
            <div className="form-grid">
              <div className="field"><label>默认轮询间隔（分钟）</label><input className="input mono" type="number" value={settings.pollIntervalMin} onChange={e => setSettings(s => ({ ...s, pollIntervalMin: Number(e.target.value) }))} /></div>
              <div className="span-2">
                <div className="switch-row">
                  <div>
                    <div style={{ fontWeight: 500 }}>GitHub Token</div>
                    <div className="hint">{settings.githubTokenConfigured ? "已配置 · 末尾 …k9f2" : "未配置"}</div>
                  </div>
                  <Pill tone={settings.githubTokenConfigured ? "success" : "warn"}>{settings.githubTokenConfigured ? "已配置" : "未配置"}</Pill>
                </div>
              </div>
              <div className="span-2">
                <div className="switch-row">
                  <div>
                    <div style={{ fontWeight: 500 }}>Webhook Secret</div>
                    <div className="hint">{settings.webhookSecretConfigured ? "已配置 · 用于校验 GitHub 签名" : "未配置"}</div>
                  </div>
                  <Pill tone={settings.webhookSecretConfigured ? "success" : "warn"}>{settings.webhookSecretConfigured ? "已配置" : "未配置"}</Pill>
                </div>
              </div>
            </div>
            <button type="button" className="btn btn-primary" style={{ marginTop: 20 }} onClick={() => onToast("同步设置已保存")}>保存设置</button>
          </div>
        )}
        {tab === "mail" && (
          <MailSettingsTab settings={settings} setSettings={setSettings} onToast={onToast} />
        )}
      </div>
    </div>
  );
}

/* ========== App Root ========== */
function App() {
  const [route, setRoute] = useState(parseHash);
  const [adminUser, setAdminUser] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem("ad:admin") || "null"); } catch { return null; }
  });
  const [publicUser, setPublicUser] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem("ad:pub") || "null"); } catch { return null; }
  });
  const [unlocked, setUnlocked] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem("ad:pw") || "{}"); } catch { return {}; }
  });
  const [apps, setApps] = useState(APPS);
  const [accessCodes, setAccessCodes] = useState(ACCESS_CODES_DEFAULT);
  const [jobs] = useState(JOBS);
  const [settings, setSettings] = useState(SETTINGS_DEFAULT);
  const [toast, setToast] = useState("");

  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener("hashchange", onHash);
    if (!location.hash) location.hash = "/";
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const showToast = useCallback(m => setToast(m), []);

  const persistAdmin = (u) => {
    setAdminUser(u);
    if (u) sessionStorage.setItem("ad:admin", JSON.stringify(u));
    else sessionStorage.removeItem("ad:admin");
  };

  const requireAdmin = (node) => {
    if (!adminUser) {
      return <AdminLogin onLogin={u => {
        persistAdmin(u);
        navigate(u.mustChangePassword ? "/admin/change-password" : "/admin");
      }} />;
    }
    if (adminUser.mustChangePassword) {
      return <ForceChangePassword user={adminUser} onDone={u => { persistAdmin(u); showToast("密码已更新"); navigate("/admin"); }} />;
    }
    return <AdminShell route={route} user={adminUser} onLogout={() => { persistAdmin(null); navigate("/admin/login"); }}>{node}</AdminShell>;
  };

  const lockSlug = (slug) => {
    if (slug == null) {
      setUnlocked({});
      sessionStorage.removeItem("ad:pw");
      showToast("已退出全部口令会话");
      return;
    }
    const next = { ...unlocked };
    delete next[slug];
    setUnlocked(next);
    sessionStorage.setItem("ad:pw", JSON.stringify(next));
    showToast(`已退出「${slug}」口令会话`);
  };

  const pubShell = (node) => (
    <PublicShell
      route={route}
      publicUser={publicUser}
      unlockedSlugs={unlocked}
      onPublicLogout={() => { setPublicUser(null); sessionStorage.removeItem("ad:pub"); showToast("已登出"); }}
      onLockSlug={lockSlug}
    >{node}</PublicShell>
  );

  const gateApp = (app, inner) => {
    if (!app) {
      return pubShell(<ForbiddenPage title="应用不存在" desc="找不到该应用，可能 slug 错误或已被下线。" code="404 NOT_FOUND" icon="box" />);
    }
    if (app.status === "archived") {
      return pubShell(<ForbiddenPage title="应用已归档" desc="该应用已停止对外分发，历史包不再提供下载。" code="410 ARCHIVED" icon="alert" />);
    }
    if (app.visibility === "password" && !unlocked[app.slug]) {
      return <PasswordGate app={app} accessCodes={accessCodes} onUnlock={(slug, codeId) => {
        const next = { ...unlocked, [slug]: true };
        setUnlocked(next);
        sessionStorage.setItem("ad:pw", JSON.stringify(next));
        if (codeId) {
          const now = new Date();
          const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
          setAccessCodes(ls => ls.map(c => c.id === codeId ? { ...c, usedCount: (c.usedCount || 0) + 1, lastUsedAt: stamp } : c));
        }
      }} />;
    }
    if (app.visibility === "login" && !publicUser) {
      return <PublicLogin onLogin={(u, redir) => { setPublicUser(u); sessionStorage.setItem("ad:pub", JSON.stringify(u)); navigate(redir || `/a/${app.slug}`); }} redirect={`/a/${app.slug}`} />;
    }
    const withLock = app.visibility === "password" ? (
      <div>
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
          <button type="button" className="btn btn-ghost btn-sm" data-od-id="lock-this-app" onClick={() => lockSlug(app.slug)}>退出本应用口令</button>
        </div>
        {inner}
      </div>
    ) : inner;
    return pubShell(withLock);
  };

  const { parts, path } = route;
  let view = null;

  // Admin routes
  if (path === "/admin/login") {
    view = <AdminLogin onLogin={u => {
      persistAdmin(u);
      navigate(u.mustChangePassword ? "/admin/change-password" : "/admin");
    }} />;
  } else if (path === "/admin/change-password") {
    if (!adminUser) {
      view = <AdminLogin onLogin={u => {
        persistAdmin(u);
        navigate(u.mustChangePassword ? "/admin/change-password" : "/admin");
      }} />;
    } else {
      view = <ForceChangePassword user={adminUser} onDone={u => { persistAdmin(u); showToast("密码已更新"); navigate("/admin"); }} />;
    }
  } else if (path === "/admin" || path.startsWith("/admin/")) {
    if (path === "/admin") view = requireAdmin(<Dashboard apps={apps} jobs={jobs} />);
    else if (path === "/admin/apps") view = requireAdmin(<AppsList apps={apps} />);
    else if (path === "/admin/apps/new") view = requireAdmin(
      <AppForm title="新建应用" onSave={f => {
        const id = "app_" + f.slug;
        const impl = providerMeta(f.releaseProvider).implemented;
        const bound = f.releaseProvider !== "none" && f.releaseOwner && f.releaseRepo;
        const syncOn = !!f.syncEnabled && impl && bound;
        setApps(a => [...a, {
          id, name: f.name, slug: f.slug, summary: f.summary || "新应用",
          visibility: f.visibility,
          releaseProvider: f.releaseProvider || "none",
          releaseOwner: f.releaseOwner || "",
          releaseRepo: f.releaseRepo || "",
          releaseBaseUrl: f.releaseBaseUrl || "",
          syncEnabled: syncOn,
          syncWebhookEnabled: syncOn && !!f.syncWebhookEnabled,
          syncPollEnabled: syncOn && !!f.syncPollEnabled,
          syncPollIntervalMin: f.syncPollIntervalMin === "" || f.syncPollIntervalMin == null ? "" : Number(f.syncPollIntervalMin),
          github: bound && f.releaseProvider === "github" ? { owner: f.releaseOwner, repo: f.releaseRepo } : null,
          includeGlob: f.includeGlob, color: "oklch(72% 0.13 195)", initials: (f.name || "AP").slice(0, 2).toUpperCase(),
          platforms: ["Windows"], latest: "—", status: "active",
          syncStatus: (syncOn && (f.syncWebhookEnabled || f.syncPollEnabled)) ? "ok" : "manual",
          lastSyncAt: "—",
          members: [], versions: [],
        }]);
        showToast(!impl && f.releaseProvider !== "none" ? "已保存（Provider 二期，同步未启用）" : "应用已创建");
        navigate("/admin/apps");
      }} />
    );
    else if (parts[0] === "admin" && parts[1] === "apps" && parts[2] && parts[3] === "edit") {
      const app = apps.find(a => a.id === parts[2]);
      view = requireAdmin(app ? (
        <AppForm title={`编辑 ${app.name}`} slugLocked initial={{
          name: app.name, slug: app.slug, summary: app.summary,
          releaseProvider: app.releaseProvider || (app.github ? "github" : "none"),
          releaseOwner: app.releaseOwner || app.github?.owner || "",
          releaseRepo: app.releaseRepo || app.github?.repo || "",
          releaseBaseUrl: app.releaseBaseUrl || "",
          visibility: app.visibility, syncEnabled: app.syncEnabled,
          syncWebhookEnabled: !!app.syncWebhookEnabled, syncPollEnabled: !!app.syncPollEnabled,
          syncPollIntervalMin: app.syncPollIntervalMin === "" || app.syncPollIntervalMin == null ? "" : String(app.syncPollIntervalMin),
          includeGlob: app.includeGlob || "",
        }} onSave={f => {
          const impl = providerMeta(f.releaseProvider).implemented;
          const bound = f.releaseProvider !== "none" && f.releaseOwner && f.releaseRepo;
          const syncOn = !!f.syncEnabled && impl && bound;
          setApps(list => list.map(x => x.id === app.id ? {
            ...x,
            name: f.name, summary: f.summary, visibility: f.visibility,
            releaseProvider: f.releaseProvider || "none",
            releaseOwner: f.releaseOwner || "",
            releaseRepo: f.releaseRepo || "",
            releaseBaseUrl: f.releaseBaseUrl || "",
            syncEnabled: syncOn,
            syncWebhookEnabled: syncOn && !!f.syncWebhookEnabled,
            syncPollEnabled: syncOn && !!f.syncPollEnabled,
            syncPollIntervalMin: f.syncPollIntervalMin === "" || f.syncPollIntervalMin == null ? "" : Number(f.syncPollIntervalMin),
            github: bound && f.releaseProvider === "github" ? { owner: f.releaseOwner, repo: f.releaseRepo } : null,
            includeGlob: f.includeGlob,
            syncStatus: (syncOn && (f.syncWebhookEnabled || f.syncPollEnabled)) ? (x.syncStatus === "manual" ? "ok" : x.syncStatus) : "manual",
          } : x));
          showToast(!impl && f.releaseProvider !== "none" ? "已更新（Provider 二期，同步未启用）" : "应用已更新");
          navigate(`/admin/apps/${app.id}`);
        }} />
      ) : <ForbiddenPage title="应用不存在" />);
    } else if (parts[0] === "admin" && parts[1] === "apps" && parts[2]) {
      const app = apps.find(a => a.id === parts[2]);
      view = requireAdmin(app ? (
        <AppAdminDetail
          key={app.id}
          app={app}
          users={USERS}
          settings={settings}
          accessCodes={accessCodes}
          onSync={() => {}}
          onToast={showToast}
          onPatchApp={(id, patch) => setApps(list => list.map(x => x.id === id ? { ...x, ...patch } : x))}
        />
      ) : <ForbiddenPage title="应用不存在" />);
    } else if (path === "/admin/access-codes") view = requireAdmin(
      <AccessCodesPage codes={accessCodes} setCodes={setAccessCodes} apps={apps} onToast={showToast} adminUser={adminUser} />
    );
    else if (path === "/admin/users") view = requireAdmin(<UsersPage users={USERS} onToast={showToast} />);
    else if (path === "/admin/jobs") view = requireAdmin(<JobsPage jobs={jobs} onToast={showToast} />);
    else if (path === "/admin/settings") view = requireAdmin(<SettingsPage settings={settings} setSettings={setSettings} onToast={showToast} initialTab={route.query.tab || "general"} />);
    else view = requireAdmin(<ForbiddenPage title="页面不存在" desc="管理端路由未匹配。" />);
  } else if (path === "/login") {
    view = <PublicLogin onLogin={(u) => { setPublicUser(u); sessionStorage.setItem("ad:pub", JSON.stringify(u)); navigate("/"); }} />;
  } else if (path === "/docs/update-check") {
    view = pubShell(<UpdateCheckDocsPage toast={showToast} />);
  } else if (path === "/empty" || path === "/forbidden") {
    view = pubShell(<ForbiddenPage code="403 FORBIDDEN" />);
  } else if (parts[0] === "a" && parts[1] && parts[2] === "v" && parts[3]) {
    const app = apps.find(a => a.slug === parts[1]);
    view = gateApp(app, <VersionPage app={app} tag={parts[3]} onDownload={() => {}} toast={showToast} />);
  } else if (parts[0] === "a" && parts[1]) {
    const app = apps.find(a => a.slug === parts[1]);
    view = gateApp(app, <AppDetailPage app={app} onDownload={() => {}} toast={showToast} />);
  } else if (path === "/" || path === "") {
    view = pubShell(<HomePage apps={apps} />);
  } else {
    view = pubShell(<ForbiddenPage title="页面不存在" desc="请从首页进入，或检查链接是否正确。" code="404 NOT_FOUND" icon="box" />);
  }

  return (
    <>
      {view}
      <Toast msg={toast} onDone={() => setToast("")} />
    </>
  );
}

Object.assign(window, { App });
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
