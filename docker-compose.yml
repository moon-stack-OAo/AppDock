services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/main.js"]
    restart: unless-stopped
    ports:
      - "${APPDOCK_PORT:-3080}:3080"
    env_file:
      - .env
    environment:
      APPDOCK_PORT: 3080
      APPDOCK_DATABASE_URL: file:/data/appdock.db
      APPDOCK_STORAGE_ROOT: /data/files
      APPDOCK_REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/worker.main.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APPDOCK_DATABASE_URL: file:/data/appdock.db
      APPDOCK_STORAGE_ROOT: /data/files
      APPDOCK_REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
